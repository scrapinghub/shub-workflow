[tox]
envlist = py, mypy, pre-commit

[testenv]
deps =
    pytest
    pytest-cov
    sentry-sdk
    slack_sdk
    spidermon
extras =
    with-gcs-tools
    with-s3-tools
commands =
    pytest {posargs}

[testenv:mypy]
basepython = python3
deps =
    {[testenv]deps}
    mypy==2.4.0
    types-dateparser
    types-pyyaml
    types-requests
    types-setuptools
commands =
    mypy --ignore-missing-imports --disable-error-code=method-assign --check-untyped-defs \
        {posargs:shub_workflow tests}

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure
skip_install = true
